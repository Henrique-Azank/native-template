[package]
name = "template-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "template-web"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
template-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

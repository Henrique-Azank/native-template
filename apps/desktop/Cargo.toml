[package]
name = "template-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "template-desktop"

[[bin]]
name = "template-desktop"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
template-engine = { workspace = true }
template-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

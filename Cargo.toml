[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/desktop", "apps/cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal workspace crates
template-core = { path = "crates/core" }
template-model = { path = "crates/model" }
template-engine = { path = "crates/engine" }
template-net = { path = "crates/net" }
template-ui-egui = { path = "crates/ui-egui" }
template-mcp = { path = "crates/mcp" }

# Foundations
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
imbl = { version = "7", features = ["serde"] }
web-time = "1"
sha2 = "0.10"

# UI & Windowing
egui = "0.36"
eframe = { version = "0.36", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false
strip = true
panic = "abort"
